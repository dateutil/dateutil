# This workflow is triggered three ways:
#
# 1. Manually triggering the workflow via the GitHub UI (Actions > Upload
#    package) will upload to test.pypi.org without the need to create a tag.
# 2. When a tag is created, the workflow will upload the package to
#    test.pypi.org.
# 3. When a GitHub Release is made, the workflow will upload the package to pypi.org.
#
# It is done this way until PyPI has draft reviews, to allow for a two-stage
# upload with a chance for manual intervention before the final publication.
#
# Uploads use PyPI trusted publishing (OIDC), so no API tokens are stored as
# secrets. The trusted publisher on both PyPI and Test PyPI must be configured
# with workflow "publish.yml" and environment "release".
name: Upload package

on:
  release:
    types: [created]
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.9'
    - name: Run updatezinfo.py (Unix)
      run: |
        python -m venv venv
        venv/bin/pip install -e .
        ./ci_tools/retry.sh venv/bin/python updatezinfo.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -U tox
    - name: Create tox environments
      run: |
        tox -p -e py,build --notest
    - name: Run tests
      run: |
        tox -e py
    - name: Build package
      run: |
        tox -e build
    - name: Upload distributions
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish package to Test PyPI
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
    - name: Publish package to PyPI
      if: github.event_name == 'release'
      uses: pypa/gh-action-pypi-publish@release/v1
