name: Validate

on:
  push:
    branches:
      - master
  pull_request:
  # Called by publish.yml, so that a release is validated (and the exact files
  # that were validated are what gets uploaded) before it is published.
  workflow_call:
    inputs:
      release:
        description: "Also install the sdist on every supported Python"
        type: boolean
        default: false

env:
  pypi-hosts: "pypi.python.org pypi.org files.pythonhosted.org"
  TZDATA_VERSION: "2024a"

jobs:
  build-tzdata:
    runs-on: ubuntu-latest
    steps:
      - name: Cache tzdata
        id: cache-tzdata
        uses: actions/cache@v6
        with:
          path: tzdata_built
          key: tzdata-${{ env.TZDATA_VERSION }}

      - name: Build tzdata
        if: steps.cache-tzdata.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lzip curl
          mkdir -p tzdata_built
          TMP_DIR=$(mktemp -d)
          cd $TMP_DIR
          curl --fail --location "https://data.iana.org/time-zones/releases/tzdb-${{ env.TZDATA_VERSION }}.tar.lz" -o tzdb.tar.lz
          tar --lzip -xf tzdb.tar.lz
          cd tzdb-${{ env.TZDATA_VERSION }}
          make install DESTDIR=$GITHUB_WORKSPACE/tzdata_built \
                        DATAFORM=main

      - name: Upload tzdata artifact
        uses: actions/upload-artifact@v7
        with:
          name: tzdata
          path: tzdata_built/usr/share/zoneinfo

  test:
    strategy:
      matrix:
        python-version: [
          "3.8",
          "3.9",
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          "3.14t",
          "3.15",
          "3.15t",
          "pypy-2.7",
          "pypy-3.8",
        ]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Older versions (<=3.7) are included separately since they need
          # special handling (using an older os or a container)
          - os: "macos-15-intel"
            python-version: "3.5"
          - os: "macos-15-intel"
            python-version: "3.6"
          - os: "macos-15-intel"
            python-version: "3.7"
          - os: "windows-latest"
            python-version: "3.5"
          - os: "windows-latest"
            python-version: "3.6"
          - os: "windows-latest"
            python-version: "3.7"
          - os: "ubuntu-latest"
            python-version: "2.7"
            use-container: true
          - os: "ubuntu-latest"
            python-version: "3.5"
            use-container: true
          - os: "ubuntu-latest"
            python-version: "3.6"
            use-container: true
          - os: "ubuntu-latest"
            python-version: "3.7"
            use-container: true
    runs-on: ${{ matrix.os }}
    needs: [build-tzdata, build-dist]
    container:
      image: ${{ matrix.use-container && format('python:{0}', matrix.python-version) || '' }}
    env:
      TOXENV: py
      PIP_TRUSTED_HOST: pypi.python.org
      SUDO: ${{ !matrix.use-container && 'sudo' || '' }}
      TZ: ${{ !startsWith(matrix.os, 'windows-latest') && 'America/New_York' || null }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set timezone (Windows)
        if: startsWith(matrix.os, 'windows-latest')
        run: tzutil /s "Eastern Standard Time"
      - if: ${{ !matrix.use-container }}
        name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }} (non-containers)
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
        env:
          PIP_TRUSTED_HOST: ${{ contains(fromJson('["2.7", "3.5", "3.6", "3.7"]'), matrix.python-version) && env.pypi-hosts || '' }}
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Download tzdata artifact
        uses: actions/download-artifact@v8
        if: startsWith(matrix.os, 'ubuntu')
        with:
          name: tzdata
          path: tzdata_download
      - name: Install specific tzdata version
        run: |
          $SUDO rm -rf /usr/share/zoneinfo
          $SUDO mv tzdata_download /usr/share/zoneinfo

          head -n 1 /usr/share/zoneinfo/tzdata.zi
        if: startsWith(matrix.os, 'ubuntu')
      - name: Install dependencies
        run: python -m pip install -U tox
      # Test the wheel that was built once, on a recent Python, rather than
      # building a package from source on each interpreter. Run locally,
      # `tox` still builds and installs an sdist itself.
      - name: Run tox on the wheel
        shell: bash
        run: python -m tox --installpkg "$(ls dist/*.whl)"
      - name: Generate coverage.xml
        run: python -m tox -e coverage
      - name: Report coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./.tox/coverage.xml
          name: ${{ matrix.os }}:${{ matrix.python-version }}
          fail_ci_if_error: false

  # Only run for releases: install the sdist, which is what pip builds from on
  # platforms that have no wheel, on every supported Python.
  test-sdist:
    if: ${{ inputs.release }}
    strategy:
      matrix:
        python-version: [
          "3.8",
          "3.9",
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          "3.14t",
          "3.15",
          "3.15t",
          "pypy-2.7",
          "pypy-3.8",
        ]
        include:
          - python-version: "2.7"
            use-container: true
          - python-version: "3.5"
            use-container: true
          - python-version: "3.6"
            use-container: true
          - python-version: "3.7"
            use-container: true
    runs-on: ubuntu-latest
    needs: [build-tzdata, build-dist]
    container:
      image: ${{ matrix.use-container && format('python:{0}', matrix.python-version) || '' }}
    env:
      TOXENV: py
      PIP_TRUSTED_HOST: pypi.python.org
      SUDO: ${{ !matrix.use-container && 'sudo' || '' }}
      TZ: America/New_York
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - if: ${{ !matrix.use-container }}
        name: Set up Python ${{ matrix.python-version }} (non-containers)
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
        env:
          PIP_TRUSTED_HOST: ${{ contains(fromJson('["2.7", "3.5", "3.6", "3.7"]'), matrix.python-version) && env.pypi-hosts || '' }}
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Download tzdata artifact
        uses: actions/download-artifact@v8
        with:
          name: tzdata
          path: tzdata_download
      - name: Install specific tzdata version
        run: |
          $SUDO rm -rf /usr/share/zoneinfo
          $SUDO mv tzdata_download /usr/share/zoneinfo

          head -n 1 /usr/share/zoneinfo/tzdata.zi
      - name: Install dependencies
        env:
          # tox 4.8, the newest tox that supports Python 3.7, deadlocks on exit
          # when it is given an sdist: its build backend process is waiting for
          # a command while tox is waiting for that process to exit.
          TOX_SPEC: ${{ matrix.python-version == '3.7' && 'tox<4' || 'tox' }}
        run: python -m pip install -U "$TOX_SPEC"
      # tox installs the sdist with pip, as a user would with --no-binary.
      - name: Run tox on the sdist
        run: python -m tox --installpkg "$(ls dist/*.tar.gz)"

  other:
    runs-on: "ubuntu-latest"
    needs: build-tzdata
    strategy:
      matrix:
        toxenv: ["docs", "tz-fat", "tz-slim", "tz-vanguard", "tz-rearguard", "precommit"]
    env:
      TOXENV: ${{ matrix.toxenv }}
      TZ: ${{ !startsWith(matrix.os, 'windows-latest') && 'America/New_York' || null }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set timezone (Windows)
        if: startsWith(matrix.os, 'windows-latest')
        run: tzutil /s "Eastern Standard Time"
      - name: ${{ matrix.toxenv }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Download tzdata artifact
        uses: actions/download-artifact@v8
        with:
          name: tzdata
          path: tzdata_download
      - name: Install specific tzdata version
        run: |
          sudo rm -rf /usr/share/zoneinfo
          sudo mv tzdata_download /usr/share/zoneinfo

          cat /usr/share/zoneinfo/tzdata.zi | head -n 1
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U tox
      - name: Run action
        run: tox

  darker:
    # This checks the lines changed by a push or PR, so it is meaningless when
    # called from the publish workflow.
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install darker
        run: python -m pip install "darker[black,isort]==3.0.0"
      - name: Run darker
        # Check only the lines changed relative to the merge base of the PR
        # (or the commit before a push). The darker GitHub action is not used
        # because its released versions refer to a commit-range action by a
        # path local to the darker repo, so it fails for everyone else; see
        # https://github.com/akaihola/darker/issues/847
        env:
          REVISION: ${{ github.event_name == 'pull_request' && format('{0}...', github.event.pull_request.base.sha) || format('{0}...', github.event.before) }}
        run: darker --check --diff --color --isort --revision "$REVISION" .

  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version comes from git tags, so we need the history.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install tox
        run: python -m pip install -U tox
      - name: Run tox
        run: python -m tox -e build
      - name: Check generation
        run: |
          exactly_one() {
            value=$(find dist -iname $1 | wc -l)
            if [ $value -ne 1 ]; then
              echo "Found $value instances of $1, not 1"
              return 1
            else
              echo "Found exactly 1 instance of $value"
            fi
          }
          # Check that exactly one tarball and one wheel are created
          exactly_one '*.tar.gz'
          exactly_one '*.whl'
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
