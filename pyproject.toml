[build-system]
requires = ["setuptools>=77", "setuptools_scm<8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-dateutil"
description = "Extensions to the standard Python datetime module"
dynamic = ["version", "readme"]
requires-python = ">=3.11"
dependencies = ["tzdata"]
license = "BSD-3-Clause OR Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
]

[[project.authors]]
name = "Gustavo Niemeyer"
email = "gustavo@niemeyer.net"

[[project.maintainers]]
name = "Paul Ganssle"
email = "dateutil@python.org"

[project.urls]
Homepage = "https://github.com/dateutil/dateutil"
Documentation = "https://dateutil.readthedocs.io/en/stable/"
Source = "https://github.com/dateutil/dateutil"

[tool.towncrier]
    package = "dateutil"
    package_dir = "dateutil"
    filename = "NEWS"
    directory = "changelog.d"
    title_format = "Version {version} ({project_date})"
    issue_format = "GH #{issue}"
    template = "changelog.d/template.rst"

    [[tool.towncrier.type]]
        directory = "data"
        name = "Data updates"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "deprecations"
        name = "Deprecations"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "feature"
        name = "Features"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "bugfix"
        name = "Bugfixes"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "doc"
        name = "Documentation changes"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "misc"
        name = "Misc"
        showcontent = true

[tool.black]
line-length = 80

[tool.isort]
atomic=true
force_grid_wrap=0
include_trailing_comma=true
known_first_party = ["dateutil"]
known_third_party=[
    "pytest",
    "hypothesis",
    "freezegun",
]
multi_line_output=3
use_parentheses=true

[tool.setuptools]
zip-safe = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/dateutil/_version.py"

[tool.pytest.ini_options]
python_files = [
    "test_*.py",
    "*_test.py",
    "*_solution.py",
]
xfail_strict = true
filterwarnings = [
    "error",
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
markers = [
    "gettz",
    "import_star",
    "isoparser",
    "parserinfo",
    "rrule",
    "rruleset",
    "rrulestr",
    "smoke",
    "tz_resolve_imaginary",
    "tzdata_properties",
    "tzfile",
    "tzlocal",
    "tzoffset",
    "tzstr",
]
